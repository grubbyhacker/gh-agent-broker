server:
  listen: "127.0.0.1:8080"
  admin_secret_env: "BROKER_ADMIN_SECRET"

audit:
  path: "/var/log/gh-agent-broker/audit.jsonl"

idempotency:
  state_path: "/var/log/gh-agent-broker/idempotency.json"

# Authenticated run-to-PR correlation (opt-in). When store_path and a capability
# API (url + token) are all set, pull.create REQUIRES a verified per-run
# capability handle in the X-Agent-Capability header, records the correlation +
# Signal Plane outbox event atomically after GitHub returns the PR number, and
# fails closed on a missing/invalid/revoked/expired handle. Leave unset to keep
# legacy pull.create behavior.
#
# capability_api_url is the broker's PRIVATE capability API base (the sandbox
# broker that mounts /v1/capabilities/*). The token is deployment-owned, held
# only by the broker, and never placed in a launched run.
# correlation:
#   store_path: "/var/log/gh-agent-broker/correlation.db"
#   capability_api_url: "http://sandbox-broker:8080"
#   capability_api_token_env: "GH_AGENT_CAPABILITY_API_TOKEN"
#   # Private outbox consumer API (claim/ack/reclaim) that Signal Plane drains.
#   # INERT until consumer_token is set; independent of correlation recording.
#   # The consumer token is the deployment-owned secret Signal Plane PRESENTS to
#   # the broker; it is NOT the capability_api_token and never enters a run.
#   # Mounted on the broker's existing authenticated listener; no new listener,
#   # port, or route is added. See docs/run-correlation-outbox-contract.md.
#   outbox:
#     consumer_token_env: "GH_AGENT_OUTBOX_CONSUMER_TOKEN"
#     claim_ttl_seconds: 300   # 30..3600 (lease before an unacked claim is reclaimable)
#     max_claim_batch: 100     # 1..1000 (hard cap on one claim call)

github:
  api_base_url: "https://api.github.com"
  git_base_url: "https://github.com"
  apps:
    coder:
      app_id: 123456
      private_key_path: "/run/secrets/github-coder-app.pem"
      installations:
        example-org/example-repo: 12345678
    reporter:
      app_id: 3684230
      private_key_path: "/run/secrets/github-reporter-app.pem"
      installations:
        grubbyhacker/*: 131601703

agents:
  - id: "hermes-coder-01"
    enabled: true
    secret_env: "HERMES_CODER_01_BROKER_SECRET"
    github_app: "coder"
    repositories:
      - "example-org/example-repo"
    operations:
      - "repo.probe"
      - "git.upload-pack"
      - "git.receive-pack"
      - "pull.create"
      - "issue.comment"
    branch_patterns:
      - "^refs/heads/agent/hermes-coder-01/.+$"
      - "^agent/hermes-coder-01/.+$"
    base_branches:
      - "main"
    branch_lifecycle_guard:
      mode: "enforce"
    permissions:
      - "contents:read"
      - "contents:write"
      - "pull_requests:write"
      - "issues:write"
    metadata_assertions:
      pull.create:
        mode: "enforce"
        fields:
          - name: "Agent-Id"
            required: true
            value: "hermes-coder-01"
            locations: ["request", "pr_body"]
          - name: "Hermes-Run-Id"
            required: true
            pattern: "^[A-Za-z0-9_.:-]+$"
            locations: ["request", "pr_body"]
          - name: "Broker-Operation-Id"
            required: true
            locations: ["pr_body"]
          - name: "GitHub-App-Installation-Id"
            required: true
            locations: ["pr_body"]
      issue.comment:
        mode: "warn"
        fields:
          - name: "Agent-Id"
            required: true
            locations: ["request", "comment_body"]
  - id: "broker-reporter-01"
    enabled: true
    secret_env: "BROKER_REPORTER_01_SECRET"
    github_app: "reporter"
    repositories:
      - "grubbyhacker/gh-agent-broker"
      - "grubbyhacker/youknowme"
      - "grubbyhacker/ykmcorpus"
    operations:
      - "repo.probe"
      - "issue.create"
    permissions:
      - "issues:write"
    metadata_assertions:
      issue.create:
        mode: "enforce"
        fields:
          - name: "Agent-Id"
            required: true
            value: "broker-reporter-01"
            locations: ["request", "issue_body"]
          - name: "Dedupe-Key"
            required: true
            pattern: "^[A-Za-z0-9_.:/-]+$"
            locations: ["request", "issue_body"]
          - name: "Broker-Operation-Id"
            required: true
            locations: ["issue_body"]
